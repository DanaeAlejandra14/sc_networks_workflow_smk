mapping_csv: resources/ROSMAP_snRNAseq_demultiplexed_ID_mapping.csv

qc:
  min_features_per_cell: 700
  min_counts_per_cell: 1500
  max_pct_mito: 13

doublet_detection:
  seed: 42

normalization:
  scale_factor: 10000 # es solo es defacult de LongNormalize ]

#After removing unwanted cells from the dataset, the next step is to normalize 
#the data. By default, we employ a global-scaling normalization 
#method “LogNormalize” that normalizes the feature expression measurements
## for each cell by the total expression, multiplies this by a scale factor 
#(10,000 by default),


annotation:
  reference_csv: resources/cell-annotation.full-atlas.csv
  celltypist_model: resources/Adult_Human_PrefrontalCortex.pkl
  majority_voting: true
  min_prob: 0.6

# Etratificación de los pacientes en grupos de control y AD según los criterios de neuropatología y cognición.
phenotype:
  clinical_csv: resources/ROSMAP_clinical.csv
  thresholds:
    braaksc_ad_min: 3
    ceradsc_ad: [1, 2]
    ceradsc_control: [3, 4]
    cogdx_control: [1]
    cogdx_ad_symptomatic: [4, 5]
    cogdx_mci: [2, 3]
  categories:
    - "AD-NC_SYM"
    - "AD-NC_ASYM"
    - "MCI"
    - "control"

cell_type:
  selected:
    - "Excitatory Neurons"
    - "Oligodendrocytes"
    - "Inhibitory Neurons"
    - "Astrocyte"
    - "Endothelial"
    - "OPCs"
    - "Microglia"

#Super cell

supercell:
  gammas: [10, 20]
  k_knn: 5
  n_pc: 30
  do_approx: false
  approx_n: 0
  seed: 42
  reduction: "harmony"

supercell_plots:
  individual_col: "individualID"
  batch_col: "libraryBatch"

aracne:
  # Red 
  pvalue: "1E-8"                 # umbral de informacion mutua (threshold)

  #  Matriz de entrada 
  matrix:
    normalize: "none"         # "log_cpm" o "none"
    min_frac_expressed: 0.1      # genes expresados en >= 10% de las metacelulas

  # Bootstraps 
  bootstrap:
    n_boot: 3                   # piloto; subir a 100 para la corrida final
    threads: 4                   # hilos por bootstrap

  # Memoria por paso (GB)
  # Se usa para Java (-Xmx) y para que Snakemake calcule cuantos
  # bootstraps caben en paralelo si lanzas con --resources mem_gb=N.
  # Si ves OutOfMemoryError en los logs de bootstrap, sube bootstrap_gb.
  memory:
    threshold_gb: 5
    bootstrap_gb: 8
    consolidate_gb: 5
 # ── Corrida final (lo que pide `rule all`) ─────────────────
  # Define QUE redes se construyen cuando lanzas el pipeline sin objetivos.
  # Local: solo astrocitos, gamma 10. Servidor: ampliar las listas.
  targets:
    phenotypes: ["AD-NC_ASYM", "AD-NC_SYM", "MCI", "control"]
    cell_types: ["Astrocyte"]
    gammas: [10]